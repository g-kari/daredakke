name: Validate Cloudflare source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run types
      - run: pnpm run check
      - run: pnpm run db:local
      - run: pnpm run dry-run
      - run: pnpm run bundle:worker
      - name: Retain verified bundled Worker
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: verified-bundled-worker
          path: dist-worker-bundled/
          if-no-files-found: error
          retention-days: 1
