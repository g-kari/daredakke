name: Unsaved-input browser regression

on:
  pull_request:
    paths: ['src/**', 'public/**', 'index.html', 'vite.config.ts', 'postcss.config.mjs', 'tests/browser/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/unsaved-input-browser.yml']
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'vite.config.ts', 'postcss.config.mjs', 'tests/browser/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/unsaved-input-browser.yml']

permissions:
  contents: read

concurrency:
  group: unsaved-input-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify shard coverage
        run: |
          mkdir -p test-results
          pnpm exec playwright test --config tests/browser/playwright.config.mjs --list --reporter=json > test-results/all-tests.json
          pnpm exec playwright test --config tests/browser/playwright.config.mjs --list --reporter=json --shard=1/2 > test-results/shard-1-tests.json
          pnpm exec playwright test --config tests/browser/playwright.config.mjs --list --reporter=json --shard=2/2 > test-results/shard-2-tests.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const testIds = (suites, parents = []) => suites.flatMap(suite => {
            const titles = [...parents, suite.title];
            return [
              ...(suite.specs ?? []).flatMap(spec => spec.tests.map(test =>
                JSON.stringify([test.projectName, spec.file, spec.line, spec.column, ...titles, spec.title]))),
              ...testIds(suite.suites ?? [], titles),
            ];
          });
          const readIds = name => testIds(JSON.parse(readFileSync(`test-results/${name}-tests.json`, 'utf8')).suites);
          const all = readIds('all');
          const shards = [readIds('shard-1'), readIds('shard-2')];
          assert.ok(all.length > 0, 'The suite must not be empty');
          assert.ok(shards.every(shard => shard.length > 0), 'Each shard must not be empty');
          const combined = shards.flat();
          assert.equal(new Set(all).size, all.length, 'Full suite contains duplicate test identities');
          assert.equal(new Set(combined).size, combined.length, 'Shards overlap or contain duplicate test identities');
          assert.deepEqual([...combined].sort(), [...all].sort(), 'Shards must cover the exact full suite');
          console.log(`Verified ${all.length} tests: ${shards.map(shard => shard.length).join(' + ')} with no overlap or omission`);
          NODE
        env:
          CI: 'true'
      - run: pnpm run test:browser --shard=${{ matrix.shard }}/2
        env:
          CI: 'true'
      - run: |
          mkdir -p test-results
          git rev-parse HEAD | tee test-results/source-sha.txt
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: unsaved-input-browser-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 1

  browser:
    if: always()
    needs: browser-shards
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.browser-shards.result }}" = success

