name: Unsaved-input browser regression

on:
  pull_request:
    paths: ['src/**', 'public/**', 'index.html', 'vite.config.ts', 'postcss.config.mjs', 'tests/browser/**', 'package*.json', '.github/workflows/unsaved-input-browser.yml']
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'vite.config.ts', 'postcss.config.mjs', 'tests/browser/**', 'package*.json', '.github/workflows/unsaved-input-browser.yml']

permissions:
  contents: read

concurrency:
  group: unsaved-input-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: 'true'
      - run: |
          mkdir -p test-results
          git rev-parse HEAD | tee test-results/source-sha.txt
        if: always()
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unsaved-input-browser-results
          path: test-results/
          retention-days: 1
